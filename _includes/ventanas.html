    <a class="blog-logo" href="../main">
        <img src="../assets/images/logo.png" alt="Webpage Logo" />
    </a>
    <div class="nav-buttons">

        <!-- Botón hamburguesa, solo móvil -->
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>

        <!-- Menú -->
        <div class="menu">
            <a class="no-menu-button" href="../assets/pdf/CV_Marco (2).pdf" target="_blank">CV</a>
            <a class="no-menu-button" href="{{ '/contact/' | relative_url }}">Contact</a>

        </div>
    </div>
</nav>

<script>
function toggleMenu() {
    document.querySelector('.menu').classList.toggle('open');
}

const menu = document.querySelector('.menu');
const menuToggle = document.querySelector('.menu-toggle');

document.addEventListener('click', (event) => {
    const clickDentroDelMenu = menu.contains(event.target);
    const clickEnElBoton = menuToggle.contains(event.target);

    if (!clickDentroDelMenu && !clickEnElBoton) {
        menu.classList.remove('open');
    }
});

</script>
